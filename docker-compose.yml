version: "3.9"

services:

  frontend:

    build:
      context: ./frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    stdin_open: true

    tty: true

    depends_on:
      - backend

  backend:

    build:
      context: ./backend

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/smartleads
      - JWT_SECRET=secret123

    depends_on:
      - mongo

  mongo:

    image: mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: